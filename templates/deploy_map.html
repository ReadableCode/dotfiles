<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deploy.map — where every config lands</title>
<style>
  :root{
    --bg:#060a11;
    --bg-2:#0a1019;
    --panel:rgba(13,20,31,.86);
    --line:#1b2635;
    --ink:#dfe9f6;
    --ink-dim:#7f93ab;
    --ink-faint:#4d5f76;
    --machine:#cfe0f5;
    --warn:#ffb454;
    --bad:#ff6b6b;
    --mono:ui-monospace,SFMono-Regular,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 22% 8%, #0d1726 0%, transparent 60%),
      radial-gradient(900px 600px at 84% 82%, #0b1a22 0%, transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    font-size:13px;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{display:flex;flex-direction:column;height:100vh}

  /* ---------- chrome ---------- */
  .topbar{
    display:flex;align-items:center;gap:18px;
    padding:12px 20px 10px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(10,16,25,.9),rgba(6,10,17,.4));
  }
  .brand{font-size:13px;letter-spacing:.06em;color:var(--ink);white-space:nowrap}
  .brand b{font-weight:600}
  .brand .dim{color:var(--ink-faint)}
  .pulse{width:7px;height:7px;border-radius:50%;background:#39d98a;display:inline-block;
    box-shadow:0 0 10px #39d98a;animation:pulse 2.4s ease-in-out infinite;margin:0 6px 0 2px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .stats{display:flex;gap:16px;margin-left:auto;color:var(--ink-faint);font-size:11.5px;letter-spacing:.04em}
  .stats b{color:var(--ink-dim);font-weight:500}
  .tabs{display:flex;gap:2px;margin-left:18px}
  .tab{
    padding:5px 13px;border:1px solid transparent;border-radius:999px;cursor:pointer;
    color:var(--ink-faint);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    transition:.18s;background:transparent;font-family:inherit;
  }
  .tab:hover{color:var(--ink-dim)}
  .tab.on{color:var(--ink);border-color:#2b3d55;background:rgba(91,157,255,.08)}

  .toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 20px;border-bottom:1px solid var(--line);background:rgba(8,13,21,.55);
  }
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;
    border:1px solid #223047;background:rgba(20,30,45,.5);color:var(--ink-dim);
    font-size:11px;letter-spacing:.05em;cursor:pointer;transition:.16s;font-family:inherit;
  }
  .chip:hover{border-color:#33507a;color:var(--ink)}
  .chip.off{opacity:.32}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
  .chip .n{color:var(--ink-faint);font-size:10px}
  .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  .hint{color:var(--ink-faint);font-size:11px;margin-left:auto;letter-spacing:.03em}
  input.search{
    background:rgba(12,19,30,.8);border:1px solid #223047;border-radius:999px;
    color:var(--ink);font-family:inherit;font-size:11.5px;padding:5px 12px;width:210px;outline:none;
  }
  input.search:focus{border-color:#3a5f95;box-shadow:0 0 0 3px rgba(58,95,149,.15)}
  input.search::placeholder{color:var(--ink-faint)}

  .view{flex:1;min-height:0;position:relative;display:none}
  .view.on{display:block}

  /* ---------- map ---------- */
  .sky{width:100%;height:100%;display:block;cursor:crosshair}
  .cl-ring{fill:none;stroke-width:1;stroke-dasharray:3 7;opacity:.42}
  .cl-halo{opacity:.13}
  .cl-title{font-size:12px;letter-spacing:.22em;font-weight:600;text-anchor:middle}
  .cl-sub{font-size:10px;letter-spacing:.09em;text-anchor:middle;fill:#516480}
  .cl-hit{fill:transparent;cursor:pointer}
  .node{cursor:pointer}
  .node .halo{opacity:0;transition:opacity .2s}
  .node .ring{fill:none;stroke-width:1.2;opacity:0;transition:opacity .2s}
  .node .core{transition:.2s}
  .node .hit{pointer-events:all}
  .node text{font-size:10px;text-anchor:middle;fill:#748aa4;transition:.2s;pointer-events:none}
  .node.on .core{filter:url(#glow)}
  .node.on .halo{opacity:.5}
  .node.on .ring{opacity:.85}
  .node.on text{fill:#e9f2ff;font-size:10.5px}
  .node.near text{fill:#b9cbe0}
  .node.mute{opacity:.2}
  .node.mute text{opacity:0}
  .node.e text{opacity:0}
  .node.d text{opacity:0}
  .node.lab text{opacity:1}
  .edge{fill:none;stroke-width:1.15;opacity:.62;stroke-linecap:round}
  .edge.flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .g-ghost path{fill:none;stroke-width:.6}

  /* ---------- floating card ---------- */
  .card{
    position:fixed;pointer-events:none;opacity:0;transform:translateY(6px);
    transition:opacity .16s,transform .16s;
    min-width:330px;max-width:410px;max-height:min(620px,78vh);overflow:hidden;padding:14px 16px 12px;
    background:var(--panel);backdrop-filter:blur(14px);
    border:1px solid #253449;border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.04);
    z-index:40;
  }
  .card.show{opacity:1;transform:translateY(0)}
  .card h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px;letter-spacing:.02em}
  .card h3 .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .kv{display:grid;grid-template-columns:86px 1fr;gap:3px 12px;font-size:11.5px;line-height:1.55}
  .kv .k{color:var(--ink-faint);letter-spacing:.04em}
  .kv .v{color:var(--ink);word-break:break-all;text-align:right}
  .card .rule{height:1px;background:var(--line);margin:10px 0 9px}
  .card .paths{font-size:11px;line-height:1.65;color:#9fb4cc}
  .card .paths div{word-break:break-all;color:#9fb4cc}
  .card .paths div+div{margin-top:2px}
  .card .note{margin-top:9px;font-size:10.5px;color:#66809b;line-height:1.5}
  .card.pin{pointer-events:auto}
  .card .contents{
    max-height:200px;overflow:auto;font-size:10.5px;line-height:1.65;color:#9fb4cc;
    border-left:2px solid #253449;padding-left:10px;
  }
  .card .contents div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .contents::-webkit-scrollbar{width:6px}
  .card .contents::-webkit-scrollbar-thumb{background:#22303f;border-radius:4px}
  .tag{display:inline-block;margin-top:11px;padding:3px 10px;border-radius:999px;font-size:10.5px;letter-spacing:.08em}

  .about{
    position:fixed;right:22px;top:104px;width:430px;max-height:76vh;overflow:auto;z-index:70;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid #253449;border-radius:14px;
    padding:16px 18px;box-shadow:0 24px 60px rgba(0,0,0,.6);display:none;font-size:11.5px;line-height:1.7;
    color:#9fb4cc;
  }
  .about.show{display:block}
  .about h4{margin:0 0 10px;font-size:13px;color:#e3edf9;font-weight:600;letter-spacing:.02em}
  .about b{color:#cfe0f5;font-weight:500}
  .about code{color:#8fb8ff}
  .about ul{margin:6px 0 12px;padding-left:16px}
  .about li{margin:2px 0}
  .about .close{float:right;cursor:pointer;color:var(--ink-faint);pointer-events:all}
  .legend{
    position:absolute;left:20px;bottom:18px;display:flex;gap:14px;flex-wrap:wrap;
    color:var(--ink-faint);font-size:10.5px;letter-spacing:.05em;pointer-events:none
  }
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legend i.sq{border-radius:3px}
  .legend i.dash{border-radius:3px;background:transparent;border:1px dashed #9fd8ff}

  /* ---------- matrix ---------- */
  .scroll{position:absolute;inset:0;overflow:auto}
  .scroll::-webkit-scrollbar{width:10px;height:10px}
  .scroll::-webkit-scrollbar-thumb{background:#1e2b3d;border-radius:6px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  table.mx{border-collapse:separate;border-spacing:0;margin:0 22px 40px;font-size:11px}
  table.mx th.corner{position:sticky;left:0;top:0;z-index:6;background:var(--bg-2);text-align:left;
    padding:0 10px 8px 4px;color:var(--ink-faint);font-weight:400;letter-spacing:.08em}
  table.mx th.host{
    position:sticky;top:0;z-index:4;background:var(--bg-2);height:132px;vertical-align:bottom;
    padding:0 0 8px;font-weight:400;
  }
  table.mx th.host div{
    writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;
    color:var(--ink-dim);letter-spacing:.05em;padding-left:3px;white-space:nowrap;font-size:10.5px;
  }
  table.mx th.host.hl div{color:#fff}
  table.mx th.host .os{font-size:9px;letter-spacing:.14em}
  table.mx td.name,table.mx th.name{
    position:sticky;left:0;z-index:3;background:var(--bg-2);white-space:nowrap;
    padding:0 12px 0 4px;color:var(--ink-dim);font-weight:400;text-align:left;height:15px;
  }
  table.mx tr.hl td.name{color:#fff}
  table.mx td.c{width:15px;height:15px;padding:0}
  table.mx .grp-start{border-left:1px solid #1b2635}
  table.mx td.tot,table.mx th.tot{padding:0 4px 0 12px;color:var(--ink-faint);font-size:10px;
    text-align:right;white-space:nowrap;font-weight:400}
  table.mx tr.hl td.tot{color:#cfe0f5}
  table.mx tr.foot td{padding-top:8px;color:var(--ink-faint);font-size:10px;text-align:center}
  table.mx tr.foot td.name{text-align:left;letter-spacing:.08em}
  table.mx td.c i{display:block;width:11px;height:11px;margin:2px;border-radius:2.5px;transition:.12s}
  table.mx tr.grp td{padding:16px 4px 5px;color:var(--ink-faint);letter-spacing:.16em;font-size:10px;
    position:sticky;left:0;background:var(--bg-2)}
  .mxwrap{padding:16px 0 0}
  .tip{
    position:fixed;pointer-events:none;z-index:60;background:var(--panel);border:1px solid #253449;
    border-radius:9px;padding:8px 11px;font-size:11px;line-height:1.6;opacity:0;transition:opacity .12s;
    backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(0,0,0,.55);max-width:440px
  }
  .tip.show{opacity:1}
  .tip b{color:#fff;font-weight:600}
  .tip .p{color:#9fb4cc;word-break:break-all}

  /* ---------- paths ---------- */
  .zones{columns:3;column-gap:16px;padding:18px 22px 40px}
  @media (max-width:1500px){.zones{columns:2}}
  .zone{
    break-inside:avoid;margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(180deg,rgba(15,23,35,.75),rgba(9,14,22,.55));
  }
  .zone h4{margin:0 0 9px;font-size:12px;font-weight:600;color:#cfe0f5;letter-spacing:.03em;
    display:flex;align-items:center;gap:8px}
  .zone h4 .cnt{margin-left:auto;color:var(--ink-faint);font-size:10px;font-weight:400}
  .zone ul{list-style:none;margin:0;padding:0}
  .zone li{display:flex;align-items:baseline;gap:8px;padding:2.5px 0;font-size:11px;line-height:1.45}
  .zone li .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
  .zone li .p{color:#9db2c9;word-break:break-all;flex:1}
  .zone li .p b{color:#e3edf9;font-weight:500}
  .zone li .n{color:var(--ink-faint);font-size:10px;white-space:nowrap}
  .zone li.mute{opacity:.2}
</style>
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>deploy.map</b> <span class="dim">·</span> <span id="stamp" class="dim"></span>
      <span class="dim">·</span><span class="pulse"></span><span id="planline" class="dim"></span></div>
    <div class="tabs">
      <button class="tab on" data-view="disk">Disk</button>
      <button class="tab" data-view="fleet">Fleet</button>
      <button class="tab" data-view="matrix">Matrix</button>
      <button class="tab" data-view="paths">Destinations</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="toolbar" id="toolbar">
    <div id="ctxchips" style="display:flex;gap:6px"></div>
    <div class="sep"></div>
    <div id="catchips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <div class="sep"></div>
    <input class="search" id="search" placeholder="filter by name or path…" spellcheck="false">
    <button class="chip" id="ghosttoggle"><span class="dot" style="color:#5b9dff"></span>all links</button>
    <button class="chip" id="aboutbtn">how this was built</button>
    <div class="hint" id="hint"></div>
  </div>

  <div class="view on" id="view-disk">
    <svg class="sky" viewBox="0 0 1780 960" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="softglow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="7" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g class="g-stars"></g><g class="g-clusters"></g><g class="g-ghost"></g>
      <g class="g-edges"></g><g class="g-nodes"></g>
    </svg>
    <div class="legend"></div>
  </div>

  <div class="view" id="view-fleet">
    <svg class="sky" viewBox="0 0 1780 960" preserveAspectRatio="xMidYMid meet">
      <g class="g-stars"></g><g class="g-clusters"></g><g class="g-ghost"></g>
      <g class="g-edges"></g><g class="g-nodes"></g>
    </svg>
    <div class="legend"></div>
  </div>

  <div class="view" id="view-matrix"><div class="scroll"><div class="mxwrap" id="mx"></div></div></div>
  <div class="view" id="view-paths"><div class="scroll"><div class="zones" id="zones"></div></div></div>
</div>
<div class="card" id="card"></div>
<div class="tip" id="tip"></div>
<div class="about" id="about"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const {hosts, entries, dests, matrix, paths, meta} = DATA;
const ACT = meta.actions;

/* ---------------- palette + taxonomy ----------------
   Every label and colour below comes from the generated dataset, so the page
   knows nothing about which contexts exist until it is opened. */
const CTX = Object.fromEntries(DATA.contexts.map(c => [c.key, c]));
const AREA = Object.fromEntries(DATA.areas.map(a => [a.key, a]));
const CATS = meta.categories;
const OSMETA = {
  darwin: {label:'macOS',   sub:'darwin'},
  linux:  {label:'LINUX',   sub:'servers · pis · vms'},
  windows:{label:'WINDOWS', sub:'laptops · desktops'},
};
const osMeta = key => OSMETA[key] || {label:key.toUpperCase(), sub:key};
const MACHINE = '#cfe0f5';
const DISK = '#9fd8ff';

const E = Object.fromEntries(entries.map((e, i) => [e.id, (e.i = i, e)]));
const H = Object.fromEntries(hosts.map((h, i) => [h.id, (h.i = i, h)]));
const byCtx = {};
entries.forEach(e => (byCtx[e.ctx] = byCtx[e.ctx] || []).push(e));
const byOs = {};
hosts.forEach(h => (byOs[h.os] = byOs[h.os] || []).push(h));

/* ---------------- shared helpers ---------------- */
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const node = document.createElementNS(NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(node);
  return node;
};
const trunc = (s, n) => (s || '').length > n ? s.slice(0, n - 1) + '…' : (s || '');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nameList = (names, limit = 3) => names.length <= limit
  ? names.map(esc).join(', ')
  : names.slice(0, limit).map(esc).join(', ') + ` <span style="color:#4d5f76">+${names.length - limit}</span>`;
const row = (k, v) => `<div class="k">${k}</div><div class="v">${v}</div>`;
const linkPath = (a, b) => {
  const dx = (b.x - a.x) * 0.46;
  return `M${a.x.toFixed(1)} ${a.y.toFixed(1)}C${(a.x + dx).toFixed(1)} ${a.y.toFixed(1)} ` +
         `${(b.x - dx).toFixed(1)} ${b.y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
};

/* ---------------- shared filter state ---------------- */
const state = {
  view: 'disk', ghost: true,
  ctx: new Set(Object.keys(CTX)), cat: new Set(Object.keys(CATS)), q: '',
};
const card = document.getElementById('card');

/* the matrix and destinations views filter whole entries with the same chips */
const visibleEntry = e =>
  state.ctx.has(e.ctx) && state.cat.has(e.cat) &&
  (!state.q || `${e.id} ${e.src} ${e.dests.join(' ')} ${e.diskDests.map(d => d.path).join(' ')}`
    .toLowerCase().includes(state.q));

/* ---------------- graph engine ----------------
   One constellation, two datasets: the disk map wires source files to the
   places on disk they land, the fleet map wires manifest entries to machines.
   Everything below is shape-agnostic - a caller hands over clusters, nodes and
   an adjacency list and gets hover / pin / isolate / filtering for free. */
function layoutClusters(clusters){
  const R = n => 74 + 15 * Math.sqrt(Math.max(n, 1));
  const side = (list, x0, x1, colsHint) => {
    if (!list.length) return;
    const cols = Math.min(colsHint, list.length), rows = Math.ceil(list.length / cols);
    const cw = (x1 - x0) / cols, ch = (900 - 70) / rows;
    list.forEach((c, i) => {
      const col = i % cols, rowIndex = Math.floor(i / cols);
      c.cx = x0 + cw * (col + .5) + (rowIndex % 2 ? 20 : -20);
      c.cy = 70 + ch * (rowIndex + .5);
      c.r = Math.min(R(c.count), cw / 2 - 26, ch / 2 + 12);
    });
  };
  side(clusters.filter(c => c.kind === 'src'), 40, 840, 2);
  const dst = clusters.filter(c => c.kind === 'dst');
  side(dst, 1000, 1740, dst.length > 3 ? 2 : 1);
  return clusters;
}

function placeNodes(nodes, cluster, seed){
  const n = nodes.length, GA = 2.3999632;
  nodes.forEach((node, i) => {
    const rad = cluster.r * 0.80 * Math.sqrt((i + 0.62) / n);
    const th = i * GA + seed;
    node.x = cluster.cx + rad * Math.cos(th);
    node.y = cluster.cy + rad * Math.sin(th) * 0.94;
  });
}

function starfield(g, seed){
  let s = seed;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 240; i++)
    el('circle', {cx:(rnd() * 1780).toFixed(1), cy:(rnd() * 960).toFixed(1),
      r:(rnd() * 1.1 + .25).toFixed(2), fill:'#9fc4ff', opacity:(rnd() * .16 + .03).toFixed(2)}, g);
}

function createGraph(cfg){
  const view = document.getElementById('view-' + cfg.key);
  const svg = view.querySelector('svg');
  const layers = {
    stars: svg.querySelector('.g-stars'), clusters: svg.querySelector('.g-clusters'),
    ghost: svg.querySelector('.g-ghost'), edges: svg.querySelector('.g-edges'),
    nodes: svg.querySelector('.g-nodes'),
  };
  const byId = Object.fromEntries(cfg.nodes.map(node => [node.id, node]));
  const adj = cfg.adjacency;
  const local = {hover:null, pinned:null, isolate:null};
  const nodeEls = {};

  cfg.clusters.forEach(c => { c.count = cfg.nodes.filter(node => node.cl === c.key).length; });
  layoutClusters(cfg.clusters);
  cfg.clusters.forEach((c, i) => placeNodes(cfg.nodes.filter(node => node.cl === c.key), c, 0.7 + i * 1.1));

  starfield(layers.stars, 20240617);

  /* clusters */
  cfg.clusters.forEach(c => {
    const grad = el('radialGradient', {id:`g-${cfg.key}-${c.key}`}, layers.clusters);
    el('stop', {offset:'0%', 'stop-color':c.color, 'stop-opacity':'.11'}, grad);
    el('stop', {offset:'70%', 'stop-color':c.color, 'stop-opacity':'.03'}, grad);
    el('stop', {offset:'100%', 'stop-color':c.color, 'stop-opacity':'0'}, grad);
    el('circle', {cx:c.cx, cy:c.cy, r:c.r * 1.04, fill:`url(#g-${cfg.key}-${c.key})`, class:'cl-halo'}, layers.clusters);
    el('circle', {cx:c.cx, cy:c.cy, r:c.r, class:'cl-ring', stroke:c.color}, layers.clusters);
    el('text', {x:c.cx, y:c.cy - c.r - 26, class:'cl-title', fill:c.color}, layers.clusters).textContent = c.label;
    el('text', {x:c.cx, y:c.cy - c.r - 12, class:'cl-sub'}, layers.clusters).textContent =
      `${c.sub} · ${c.count}`;
    const hit = el('rect', {x:c.cx - 150, y:c.cy - c.r - 40, width:300, height:36, class:'cl-hit'}, layers.clusters);
    hit.addEventListener('click', ev => {
      ev.stopPropagation();
      local.isolate = local.isolate === c.key ? null : c.key;
      local.pinned = null;
      refresh();
    });
  });

  /* nodes */
  cfg.nodes.forEach(node => {
    const grp = el('g', {class:'node ' + (node.derived ? 'd' : 'e'), 'data-id':node.id}, layers.nodes);
    const size = node.size || 4;
    el('circle', {cx:node.x, cy:node.y, r:15, fill:'transparent', class:'hit'}, grp);
    if (node.shape === 'square' || node.shape === 'folder'){
      el('rect', {x:node.x - size - 4.5, y:node.y - size - 4.5, width:size * 2 + 9, height:size * 2 + 9,
        rx:5, fill:node.color, class:'halo', filter:'url(#softglow)', opacity:'0'}, grp);
      el('rect', {x:node.x - size - 4, y:node.y - size - 4, width:size * 2 + 8, height:size * 2 + 8,
        rx:5, class:'ring', stroke:node.color}, grp);
      el('rect', {x:node.x - size, y:node.y - size, width:size * 2, height:size * 2, rx:2.4,
        class:'core', fill:node.color, opacity:'.85'}, grp);
      if (node.shape === 'folder')
        el('rect', {x:node.x - size - 7, y:node.y - size - 7, width:size * 2 + 14, height:size * 2 + 14,
          rx:6, fill:'none', stroke:node.color, 'stroke-dasharray':'2 3', opacity:'.55'}, grp);
    } else {
      el('circle', {cx:node.x, cy:node.y, r:size + 8, fill:node.color, class:'halo',
        filter:'url(#softglow)', opacity:'0'}, grp);
      el('circle', {cx:node.x, cy:node.y, r:size + 5, class:'ring', stroke:node.color}, grp);
      el('circle', {cx:node.x, cy:node.y, r:size, class:'core', fill:node.color,
        opacity:node.dim ? '.5' : '.95'}, grp);
    }
    el('text', {x:node.x, y:node.y + size + 12}, grp).textContent = trunc(node.label, 24);
    nodeEls[node.id] = grp;
    grp.addEventListener('mouseenter', () => { local.hover = node.id; refresh(); });
    grp.addEventListener('mouseleave', () => { local.hover = null; refresh(); });
    grp.addEventListener('click', ev => {
      ev.stopPropagation();
      local.pinned = local.pinned === node.id ? null : node.id;
      refresh();
    });
  });

  /* the faint web of every link, drawn once */
  const buckets = {};
  Object.entries(adj).forEach(([id, others]) => {
    const from = byId[id];
    if (!from || from.derived) return;   // draw each pair once, from the source side
    others.forEach(otherId => {
      const to = byId[otherId];
      if (to) (buckets[from.color] = buckets[from.color] || []).push(linkPath(from, to));
    });
  });
  Object.entries(buckets).forEach(([color, list]) =>
    el('path', {d:list.join(' '), stroke:color, opacity:'.042'}, layers.ghost));

  svg.addEventListener('click', () => { local.pinned = null; refresh(); });

  function passesFilters(node){
    if (node.ctx && !state.ctx.has(node.ctx)) return false;
    if (node.cat && !state.cat.has(node.cat)) return false;
    if (state.q && !(node.text || '').toLowerCase().includes(state.q)) return false;
    return true;
  }
  function visible(node){
    if (!passesFilters(node)) return false;
    // a place on disk is only as visible as the sources that feed it
    if (node.derived && (adj[node.id] || []).length &&
        !(adj[node.id] || []).some(id => byId[id] && passesFilters(byId[id]))) return false;
    if (!local.isolate) return true;
    return node.cl === local.isolate ||
      (adj[node.id] || []).some(id => byId[id] && byId[id].cl === local.isolate);
  }

  function refresh(){
    const activeId = local.hover || local.pinned;
    const active = activeId ? byId[activeId] : null;
    const near = new Set(active ? (adj[activeId] || []).filter(id => byId[id] && visible(byId[id])) : []);
    layers.edges.textContent = '';
    if (active){
      near.forEach(id => {
        const other = byId[id];
        const [a, b] = active.derived ? [other, active] : [active, other];
        el('path', {d:linkPath(a, b), stroke:(active.derived ? other : active).color,
          class:'edge' + (local.pinned === activeId ? ' flow' : '')}, layers.edges);
      });
    }
    cfg.nodes.forEach(node => {
      const element = nodeEls[node.id];
      const shown = visible(node);
      const isNear = near.has(node.id);
      element.classList.toggle('on', node.id === activeId);
      element.classList.toggle('near', isNear);
      element.classList.toggle('mute', !shown || (!!activeId && node.id !== activeId && !isNear));
      element.classList.toggle('lab', node.id === activeId || isNear || (shown && (!!state.q ||
        (!!local.isolate && (node.cl === local.isolate)))));
    });
    if (state.view === cfg.key) drawCard(active, cfg, nodeEls, local.pinned === activeId);
    hint();
  }
  function hint(){
    if (state.view !== cfg.key) return;
    document.getElementById('hint').textContent = local.pinned
      ? 'pinned — click the node again (or the background) to release'
      : local.isolate
        ? `isolated: ${local.isolate.replace(/_/g, ' ')} — click the cluster label again to release`
        : cfg.hint;
  }
  layers.ghost.style.display = state.ghost ? '' : 'none';
  return {key:cfg.key, refresh, ghost:layers.ghost, hint};
}

/* ---------------- the floating detail card ---------------- */
function drawCard(node, cfg, nodeEls, pinned){
  if (!node){ card.classList.remove('show', 'pin'); return; }
  card.innerHTML = cfg.card(node);
  card.classList.add('show');
  card.classList.toggle('pin', !!pinned);
  const box = nodeEls[node.id].getBoundingClientRect();
  const vw = window.innerWidth || document.documentElement.clientWidth || 1600;
  const vh = window.innerHeight || document.documentElement.clientHeight || 900;
  const w = card.offsetWidth, h = card.offsetHeight;
  let left = box.right + 22;
  if (left + w > vw - 16) left = box.left - w - 22;
  card.style.left = Math.max(14, Math.min(left, vw - w - 14)) + 'px';
  card.style.top = Math.max(72, Math.min(box.top + box.height / 2 - h / 2, vh - h - 16)) + 'px';
}

/* ---------------- page 1: the disk map ----------------
   Source files on the left, the places on disk they land on the right. Machines
   are deliberately absent: {host} stays symbolic, so one workspace file is one
   node instead of one per machine. */
const DISK_KIND = node => node.data.isDir ? 'folder link' : 'file link';

function buildDiskGraph(){
  // keyed by the file itself, so one file referenced by two manifests is one node
  const repoCtx = {};
  DATA.contexts.forEach(c => c.repos.forEach(repo => repoCtx[repo] = c.key));
  const sources = {};
  entries.forEach(e => {
    const source = sources[e.srcPath] = sources[e.srcPath] ||
      {key:e.srcPath, repo:e.srcRepo, src:e.srcPath.split('/').slice(1).join('/'),
       ctx:repoCtx[e.srcRepo] || e.ctx, entries:[], isDir:e.isDir};
    source.entries.push(e);
    source.isDir = source.isDir || e.isDir;
  });

  const nodes = [], adjacency = {};
  const link = (a, b) => {
    (adjacency[a] = adjacency[a] || []).push(b);
    (adjacency[b] = adjacency[b] || []).push(a);
  };

  Object.values(sources).forEach(source => {
    const dests = source.entries.flatMap(e => e.diskDests.map(d => d.path));
    nodes.push({
      id:'s:' + source.key, cl:source.ctx, color:CTX[source.ctx].color,
      label:source.src.split('/').slice(-1)[0] + (source.isDir ? '/' : ''),
      size:2.4 + Math.sqrt(Math.max(dests.length, 1)) * 1.15,
      ctx:source.ctx, cat:source.entries[0].cat, dim:!dests.length,
      text:`${source.key} ${source.entries.map(e => e.id).join(' ')} ${dests.join(' ')}`,
      data:source,
    });
  });

  DATA.disk.forEach(place => {
    const owners = place.entries.map(id => E[id]);
    const isDir = owners.some(e => e.isDir);
    // a place fed by exactly one context wears that colour; shared places stay neutral
    const feeders = [...new Set(owners.map(e => repoCtxOf(e.srcPath)))];
    nodes.push({
      id:'d:' + place.path, cl:place.area, shape:isDir ? 'folder' : 'square',
      color:feeders.length === 1 ? CTX[feeders[0]].color : DISK,
      label:shortDiskLabel(place.path), size:isDir ? 5 : 4, derived:true,
      text:`${place.path} ${place.entries.join(' ')}`,
      data:{...place, owners, isDir},
    });
    owners.forEach(e => link('s:' + e.srcPath, 'd:' + place.path));
  });

  const clusters = DATA.contexts.map(c => ({
    key:c.key, kind:'src', color:c.color, label:c.label, sub:'source files',
  })).concat(DATA.areas.map(a => ({
    key:a.key, kind:'dst', color:DISK, label:a.label, sub:a.sub,
  })));

  return createGraph({
    key:'disk', clusters, nodes, adjacency, card:diskCard,
    hint:'hover a file · click to pin · click a cluster label to isolate',
  });
}

function repoCtxOf(srcPath){
  const found = DATA.contexts.find(c => c.repos.includes(srcPath.split('/')[0]));
  return found ? found.key : DATA.contexts[0].key;
}

function shortDiskLabel(path){
  if (!path.startsWith(meta.repoParent + '/')) return path.replace(/^~\//, '');
  const rest = path.slice(meta.repoParent.length + 1).split('/');
  return rest.length <= 2 ? rest.join('/') : `${rest[0]}/${rest[rest.length - 1]}`;
}

function diskCard(node){
  if (node.derived){
    const place = node.data;
    const owners = place.owners;
    const sourceLines = [...new Set(owners.map(e => e.srcPath))].map(path =>
      `<div><span style="color:${CTX[repoCtxOf(path)].color}">${esc(path.split('/')[0])}</span>` +
      `/${esc(path.split('/').slice(1).join('/'))}</div>`).join('');
    const siblings = owners.flatMap(e => e.diskDests.map(d => d.path)).filter(p => p !== place.path);
    let html = `<h3><span class="dot" style="background:${DISK};border-radius:${place.isDir ? '3px' : '50%'}"></span>` +
      `${esc(place.path.split('/').slice(-1)[0])}${place.isDir ? '/' : ''}</h3>` +
      `<div class="paths" style="margin-bottom:9px"><div style="color:#cfe0f5">${esc(place.path)}</div></div>` +
      `<div class="kv">` +
      row('area', AREA[place.area].label) +
      row('kind', place.isDir ? 'directory link' : 'file link') +
      row('platforms', place.platforms.join(' · ')) +
      row('entry', nameList(owners.map(e => e.id))) +
      `</div><div class="rule"></div>` +
      `<div class="paths"><div style="color:#4d5f76;margin-bottom:3px">linked from</div>${sourceLines}</div>`;
    const contents = owners.filter(e => e.contents && e.contents.length);
    if (contents.length){
      const files = contents[0].contents;
      html += `<div class="rule"></div><div style="color:#4d5f76;margin-bottom:4px">` +
        `contents right now · ${files.length}${contents[0].contentsTruncated ? '+' : ''} files</div>` +
        `<div class="contents">${files.map(f => `<div>${esc(f)}</div>`).join('')}</div>`;
    }
    if (siblings.length){
      html += `<div class="rule"></div><div class="paths"><div style="color:#4d5f76;margin-bottom:3px">` +
        `the same source also lands at · ${siblings.length}</div>` +
        siblings.slice(0, 4).map(p => `<div>${esc(p)}</div>`).join('') +
        (siblings.length > 4 ? `<div style="color:#4d5f76">+${siblings.length - 4} more</div>` : '') + `</div>`;
    }
    return html + `<span class="tag" style="background:${DISK}1f;color:${DISK}">${AREA[place.area].sub}</span>`;
  }

  const source = node.data;
  const dests = source.entries.flatMap(e => e.diskDests.map(d => d.path));
  const color = CTX[source.ctx].color;
  let html = `<h3><span class="dot" style="background:${color}"></span>${esc(source.src.split('/').slice(-1)[0])}</h3>` +
    `<div class="kv">` +
    row('repo', esc(source.repo)) +
    row('file', esc(source.src)) +
    row('kind', source.isDir ? 'directory' : 'file') +
    row('lands at', `<b style="color:${color}">${dests.length}</b> place${dests.length === 1 ? '' : 's'} on disk`) +
    row('entries', nameList(source.entries.map(e => e.id))) +
    `</div>`;
  if (dests.length){
    html += `<div class="rule"></div><div class="paths">` +
      dests.slice(0, 6).map(p => `<div>${esc(p)}</div>`).join('') +
      (dests.length > 6 ? `<div style="color:#4d5f76">+${dests.length - 6} more</div>` : '') + `</div>`;
  } else {
    html += `<div class="rule"></div><div class="note">no link by design — deployed by hand</div>`;
  }
  return html + `<span class="tag" style="background:${color}1f;color:${color}">` +
    `${CATS[source.entries[0].cat] || source.entries[0].cat}</span>`;
}

/* ---------------- page 2: the fleet map ----------------
   The original view: which machine gets which manifest entry. */
function buildFleetGraph(){
  const nodes = [], adjacency = {};
  entries.forEach(e => {
    nodes.push({
      id:'e:' + e.id, cl:e.ctx, color:CTX[e.ctx].color, label:e.id,
      size:e.hosts.length ? 2.4 + Math.sqrt(e.hosts.length) * 0.95 : 2.6,
      ctx:e.ctx, cat:e.cat, dim:!e.hosts.length,
      text:`${e.id} ${e.src} ${e.dests.join(' ')}`, data:e,
    });
  });
  hosts.forEach(h => {
    nodes.push({
      id:'h:' + h.id, cl:h.os, color:MACHINE, shape:'square', size:4, derived:true,
      text:`${h.id} ${h.name}`, data:h,
    });
  });
  entries.forEach(e => e.hosts.forEach(id => {
    (adjacency['e:' + e.id] = adjacency['e:' + e.id] || []).push('h:' + id);
    (adjacency['h:' + id] = adjacency['h:' + id] || []).push('e:' + e.id);
  }));

  const clusters = DATA.contexts.map(c => ({
    key:c.key, kind:'src', color:c.color, label:c.label, sub:c.sub,
  })).concat(meta.platforms.map(p => ({
    key:p, kind:'dst', color:MACHINE, label:osMeta(p).label, sub:osMeta(p).sub,
  })));

  return createGraph({
    key:'fleet', clusters, nodes, adjacency, card:fleetCard,
    hint:'hover a node · click to pin · click a cluster label to isolate',
  });
}

function fleetCard(node){
  if (!node.derived){
    const e = node.data, color = CTX[e.ctx].color;
    let html = `<h3><span class="dot" style="background:${color}"></span>${esc(e.id)}</h3><div class="kv">` +
      row('source', esc(e.repo)) +
      row('file', esc(e.src.split('/').slice(-2).join('/'))) +
      row('manifest', esc(e.manifest.split('/').pop())) +
      row('method', e.method === 'none' ? 'none (by design)' : 'symlink') +
      row('platforms', e.platforms.length ? e.platforms.join(' · ') : '—') +
      row('host filter', e.hostsFilter.length ? e.hostsFilter.length + ' machines' : 'any host') +
      row('reaches', `<b style="color:${color}">${e.hosts.length}</b> / ${hosts.length} machines`) +
      `</div>`;
    if (e.dests.length){
      html += `<div class="rule"></div><div class="paths">` +
        e.dests.slice(0, 4).map(d => `<div>${esc(d)}</div>`).join('') +
        (e.dests.length > 4 ? `<div style="color:#4d5f76">+${e.dests.length - 4} more path variants</div>` : '') +
        `</div>`;
    }
    if (e.note) html += `<div class="rule"></div><div class="note">${esc(trunc(e.note, 210))}</div>`;
    return html + `<span class="tag" style="background:${color}1f;color:${color}">${CATS[e.cat] || e.cat}</span>`;
  }
  const h = node.data;
  const zones = Object.entries(h.zones).sort((a, b) => b[1].length - a[1].length).slice(0, 5);
  const perCtx = {};
  h.entries.forEach(id => perCtx[E[id].ctx] = (perCtx[E[id].ctx] || 0) + 1);
  return `<h3><span class="dot" style="background:${MACHINE}"></span>${esc(h.name)}</h3><div class="kv">` +
    row('platform', osMeta(h.os).label + ' · ' + h.os) +
    row('inventory', esc(h.inventory)) +
    row('receives', `<b>${h.entries.length}</b> of ${entries.length} configs`) +
    row('by context', Object.entries(perCtx).map(([k, v]) =>
      `<span style="color:${CTX[k].color}">${v}</span>`).join(' · ')) +
    row('skipped', `${h.counts.skip_platform || 0} platform · ${h.counts.skip_host || 0} host-filter` +
      (h.counts.skip_variant ? ` · ${h.counts.skip_variant} variant` : '')) +
    row('prunes', `${h.prune.length} removals-listed paths`) +
    `</div><div class="rule"></div><div class="paths">` +
    zones.map(([z, list]) => `<div>${esc(z)} <span style="color:#4d5f76">· ${list.length} file` +
      `${list.length > 1 ? 's' : ''}</span></div>`).join('') +
    `</div><span class="tag" style="background:#cfe0f51a;color:#cfe0f5">${osMeta(h.os).sub}</span>`;
}

const GRAPHS = [buildDiskGraph(), buildFleetGraph()];

const tip = document.getElementById('tip');

  tip.innerHTML = html; tip.classList.add('show');

  tip.style.left = Math.min(ev.clientX + 16, window.innerWidth - w - 12) + 'px';

function cellStyle(code, ctx){
  switch (ACT[code]){
    case 'apply':         return {bg:CTX[ctx].color, op:.92, label:'deployed'};
    case 'skip_platform': return {bg:'#1d2836', op:1, label:'no dest for this platform'};
    case 'skip_host':     return {bg:'#2b2033', op:1, label:'excluded by hosts filter'};
    case 'skip_variant':  return {bg:'#33301c', op:1, label:'no matching variant file'};
    case 'skip_requires': return {bg:'#3a2222', op:1, label:'requires path absent'};
    default:              return {bg:'#141c28', op:1, label:'no link by design'};
  }
}

function buildMatrix(){
  const box = document.getElementById('mx');
  const table = document.createElement('table');
  table.className = 'mx';
  const head = document.createElement('tr');
  head.innerHTML = `<th class="corner">${entries.length} entries × ${hosts.length} machines</th>`;
  hosts.forEach((h, i) => {
    const th = document.createElement('th');
    th.className = 'host' + (i === 0 || hosts[i-1].os !== h.os ? ' grp-start' : '');
    th.dataset.h = h.i;
    th.innerHTML = `<div>${h.id} <span class="os" style="color:#4d5f76">${h.os.slice(0,3).toUpperCase()}</span></div>`;
    head.appendChild(th);
  });
  const reachHead = document.createElement('th');
  reachHead.className = 'tot';
  reachHead.innerHTML = '<div style="writing-mode:vertical-rl;transform:rotate(180deg)">machines</div>';
  head.appendChild(reachHead);
  table.appendChild(head);

  let lastCtx = null;
  entries.forEach(e => {
    if (e.ctx !== lastCtx){
      lastCtx = e.ctx;
      const gr = document.createElement('tr');
      gr.className = 'grp';
      gr.innerHTML = `<td colspan="${hosts.length + 2}" style="color:${CTX[e.ctx].color}">${CTX[e.ctx].label} <span style="color:#3d4d61">· ${byCtx[e.ctx].length} entries</span></td>`;
      table.appendChild(gr);
    }
    const tr = document.createElement('tr');
    tr.dataset.e = e.i;
    const shown = visibleEntry(e);
    tr.style.opacity = shown ? 1 : .18;
    const nameCell = document.createElement('td');
    nameCell.className = 'name';
    nameCell.textContent = e.id;
    tr.appendChild(nameCell);
    hosts.forEach((h, hi) => {
      const td = document.createElement('td');
      td.className = 'c' + (hi === 0 || hosts[hi-1].os !== h.os ? ' grp-start' : '');
      const cell = matrix[e.i][h.i];
      const st = cellStyle(cell[0], e.ctx);
      const i = document.createElement('i');
      i.style.background = st.bg;
      i.style.opacity = st.op;
      td.appendChild(i);
      td.addEventListener('mousemove', ev => {
        const dest = cell[1] >= 0 ? dests[cell[1]] : null;
        showTip(`<b>${e.id}</b> → <b>${h.id}</b><br>` +
          `<span style="color:${ACT[cell[0]] === 'apply' ? CTX[e.ctx].color : '#8fa3bb'}">${st.label}</span>` +
          (dest ? `<br><span class="p">${dest}</span>` : '') +
          `<br><span style="color:#4d5f76">from ${e.repo}/${e.src}</span>`, ev);
        tr.classList.add('hl');
        table.querySelectorAll('th.host')[h.i] && table.querySelectorAll('th.host')[h.i].classList.add('hl');
      });
      td.addEventListener('mouseleave', () => {
        hideTip(); tr.classList.remove('hl');
        table.querySelectorAll('th.host').forEach(x => x.classList.remove('hl'));
      });
      tr.appendChild(td);
    });
    const tot = document.createElement('td');
    tot.className = 'tot';
    tot.textContent = e.hosts.length ? e.hosts.length + '×' : '—';
    tr.appendChild(tot);
    table.appendChild(tr);
  });
  const foot = document.createElement('tr');
  foot.className = 'foot';
  foot.innerHTML = `<td class="name">configs per machine</td>` +
    hosts.map(h => `<td>${h.entries.length}</td>`).join('') + `<td class="tot"></td>`;
  table.appendChild(foot);
  box.textContent = '';
  const key = document.createElement('div');
  key.style.cssText = 'display:flex;gap:16px;padding:0 22px 14px;color:#4d5f76;font-size:10.5px;letter-spacing:.05em';
  key.innerHTML = ['deployed', 'no dest for this platform', 'excluded by hosts filter', 'no matching variant',
    'no link by design'].map((label, i) => {
      const bg = [DATA.contexts[0].color, '#1d2836', '#2b2033', '#33301c', '#141c28'][i];
      return `<span style="display:inline-flex;align-items:center;gap:6px">
        <i style="width:10px;height:10px;border-radius:2.5px;background:${bg};display:inline-block"></i>${label}</span>`;
    }).join('');
  box.appendChild(key);
  box.appendChild(table);
}

/* ---------------- paths ---------------- */
function buildPaths(){
  const box = document.getElementById('zones');
  box.textContent = '';
  Object.entries(paths).forEach(([zone, items]) => {
    const div = document.createElement('div');
    div.className = 'zone';
    const shownItems = items.filter(it => visibleEntry(E[it.entry]));
    if (!shownItems.length) return;
    div.innerHTML = `<h4>${zone}<span class="cnt">${shownItems.length} file${shownItems.length > 1 ? 's' : ''}</span></h4>`;
    const ul = document.createElement('ul');
    shownItems.forEach(it => {
      const li = document.createElement('li');
      const tail = it.path.startsWith(zone + '/') ? it.path.slice(zone.length + 1) : it.path;
      li.innerHTML = `<span class="bar" style="background:${CTX[it.ctx].color}"></span>` +
        `<span class="p"><b>${tail}</b><br>${it.entry}</span>` +
        `<span class="n">${it.hosts.length}×</span>`;
      li.title = `${it.entry} → ${it.path}\nmachines: ${it.hosts.join(', ')}`;
      ul.appendChild(li);
    });
    div.appendChild(ul);
    box.appendChild(div);
  });
}

/* ---------------- about ---------------- */
(function about(){
  const box = document.getElementById('about');
  box.innerHTML = `<span class="close" id="aboutclose">×</span>
    <h4>How this map was built</h4>
    Every link comes from <code>dotfiles/src/deploy_configs.py</code> itself — the same
    <code>load_manifests()</code> + <code>build_plan()</code> the deployer runs, executed once per machine in the
    host inventories, then rolled up by <code>src/deploy_map.py</code>. Nothing here is hand-listed, and the page
    regenerates on every deploy.
    <ul>
      ${meta.manifests.map(m => `<li><code>${m}</code></li>`).join('')}
    </ul>
    <b>What is exact:</b> platform dest blocks, <code>hosts:</code> filters and per-host variant files are
    evaluated for real, per machine. <b>What is assumed:</b> <code>requires:</code> preconditions are treated as
    met, so the map does not change shape depending on which repos the machine that regenerated it happens to
    have cloned — a machine actually missing a checkout would report <code>skip_requires</code> for those
    entries. Paths are shown home-relative for the same reason.
    <ul>
      <li><b>${meta.entryCount}</b> manifest entries across <b>${meta.manifests.length}</b> manifests</li>
      <li><b>${meta.hostCount}</b> deploy-target machines · <b>${meta.linkCount.toLocaleString()}</b> symlinks
          · <b>${meta.destCount}</b> distinct destination paths</li>
      <li><b>${meta.nonTargets.length}</b> more inventory devices (phones, TVs, switches, routers) are in the
          host files but receive nothing</li>
    </ul>
    <b>Disk</b> is the default view and asks where a file on disk comes from: source files on the left, the
    places they land on the right, grouped by what kind of place it is rather than by machine. <code>{host}</code>
    stays symbolic there, so one workspace file is one node instead of one per machine, and a source referenced by
    two manifests is one node because it is one file. A dashed square is a <b>folder link</b> — its card lists
    what is inside the directory right now.
    <b>Fleet</b> is the same constellation wired to machines instead: which machine receives which entry.
    <b>Matrix</b> is the full entry × machine grid including why a cell is empty; <b>Destinations</b> is the
    filesystem tree the links actually land in, as deployed.`;
  const toggle = () => box.classList.toggle('show');
  document.getElementById('aboutbtn').onclick = toggle;
  box.addEventListener('click', ev => { if (ev.target.id === 'aboutclose') box.classList.remove('show'); });
})();

buildMatrix();
buildPaths();
GRAPHS.forEach(graph => graph.refresh());
graphFor('disk').hint();
</script>
