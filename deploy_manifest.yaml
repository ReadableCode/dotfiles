# Deploy manifest — which repo configs are deployed where on each machine.
# Sibling `<context>_credentials/<context>_manifest.yaml` overlay manifests
# (same entry schema, `repo:` paths relative to their own repo root) are
# loaded additionally when those repos are cloned next to dotfiles.
# Consumed by `src/deploy_configs.py`:
#
#   uv run python src/deploy_configs.py             # deploy for this machine
#   uv run python src/deploy_configs.py status      # read-only drift report +
#                                                   # planned actions (cron-able)
#
# Entry schema:
#   - name: unique identifier
#     repo: path relative to the repo root. Resolved against <base>.<token>.<ext>
#           variant files (lowercase token): exact hostname first, then platform
#           (darwin/mac, linux, windows), then the bare default. Hosts with no
#           matching variant and no bare file are skipped, so new host variants
#           need no manifest change. Context tags (settings.<context>.json)
#           are never auto-resolved.
#     dest:                       # per-platform destination (omit a platform to skip it)
#       darwin: ~/path            # {host} expands to the lowercase short hostname,
#       linux: ~/path             # {repo_parent} to the directory containing this
#       windows: ~/path           # repo checkout (e.g. ~/GitHub)
#     hosts: [ENVY, ELITEDESK]    # optional: limit to specific hostnames (uppercase,
#                                 # matched against the short hostname). OVERLAY
#                                 # MANIFESTS ONLY - names are validated against the
#                                 # union of the `*_credentials` host inventories, and
#                                 # only an overlay travels with the inventory that
#                                 # knows its names; a filter here would fail to
#                                 # validate on machines that clone other inventories
#                                 # (enforced at load).
#     method: symlink | none      # default symlink. "none" = inventory-only entry:
#                                 # the app is configured without links (see note).
#                                 # There is no copy method - copies silently drift.
#     requires: ~/path            # optional precondition: skip the entry (SKIP_REQUIRES)
#                                 # unless this path (or, given a list of paths, ALL of
#                                 # them) already exists. Placeholders expand like dest.
#                                 # Set it when dest lives inside a sibling repo checkout
#                                 # so deploy never creates a repo's folder on a machine
#                                 # that hasn't cloned it (which would break a later git
#                                 # clone); list both the dest repo and the credentials
#                                 # source repo so the entry follows the clones instead
#                                 # of a hosts whitelist. Configs that OWN their dest dir
#                                 # (~/.config/nvim, ~/.claude, ...) must NOT set it -
#                                 # creating those dirs is wanted.
#     note: free text caveat
#
# Entries with `method: none` document apps that intentionally do NOT use links,
# so this file is a complete inventory of deployed configs, not just a link list.

# --- Shells ---

- name: zshrc
  repo: application_configs/bash/.zshrc
  dest:
    darwin: ~/.zshrc

- name: zshrc_local
  repo: application_configs/bash/zshrc_local
  dest:
    darwin: ~/.zshrc.local
  note: >-
    Machine-local exports sourced by .zshrc. Only per-host zshrc_local.<host>
    variants exist (no bare default), so hosts without one skip this entry.

- name: bashrc
  repo: application_configs/bash/.bashrc
  dest:
    linux: ~/.bashrc
  note: "Also used on Android/Termux (platform.system() reports Linux there)."

- name: bash_aliases
  repo: application_configs/bash/.bash_aliases
  dest:
    linux: ~/.bash_aliases

- name: shared_aliases
  repo: application_configs/bash/.shared_aliases
  dest:
    darwin: ~/.shared_aliases
    linux: ~/.shared_aliases
  note: >-
    Sourced by .zshrc and .bash_aliases, which this same run deploys.
    Context-specific aliases are NOT in this file: it sources every
    ~/.shell_local.d/*.sh shard, deployed one-per-context by the *_credentials
    overlay manifests (same contract as the PowerShell profile's
    ~\.powershell_local.d\ loader).

# --- Terminal / multiplexer ---

- name: tmux_conf
  repo: application_configs/tmux/.tmux.conf
  dest:
    darwin: ~/.tmux.conf
    linux: ~/.tmux.conf
    windows: ~/.tmux.conf
  note: >-
    On Windows tmux runs under MSYS2, whose HOME resolves to the Windows
    profile, so ~/.tmux.conf is correct there too.

# --- Editors ---

- name: nvim_init
  repo: application_configs/nvim/init.lua
  dest:
    darwin: ~/.config/nvim/init.lua
    linux: ~/.config/nvim/init.lua
  note: "Windows deliberately has no dest here - see nvim_init_windows."

- name: nvim_init_windows
  repo: application_configs/nvim/init.lua
  method: none
  note: >-
    nvim on Windows uses XDG_CONFIG_HOME (set in
    application_configs/powershell/powershell_aliases.ps1) to point straight at
    the repo's application_configs folder - no link or copy needed, and nothing
    breaks when git pull runs. See docs/setup_neovim.md.

# VS Code workspace files AND settings.json live in the credentials overlays
# (entries vscode_workspace + vscode_settings in personal_manifest.yaml,
# per-host entries in the client manifests): a workspace file lists every
# sibling repo at once, and settings.json carries the Remote-SSH host map plus
# repo exclude lists - exactly the cross-client inventory the public repo must
# not carry. Settings moved out 2026-08-14; the overlay entries re-claim the
# same dests, so machines relink on their next deploy (a machine that loads no
# overlay at all keeps a dangling link until one is cloned - removals can't
# name these dests while live entries still want them).

# Zed settings.json also lives in personal_credentials (entry zed_settings
# there, moved 2026-08-14): its ssh_connections block names client checkouts
# on a client machine - same cross-client inventory as above.

# --- Git ---

- name: git_ignore
  repo: application_configs/git/ignore
  dest:
    darwin: ~/.config/git/ignore
    linux: ~/.config/git/ignore
    windows: ~/.config/git/ignore
  note: >-
    ~/.config/git/ignore is git's default global ignore path (no gitconfig entry
    needed). Candidate for config-path indirection instead of a link:
    git config --global core.excludesFile <repo path>.
    Git for Windows sets HOME from USERPROFILE and honours the same default
    path, so windows uses the identical dest. It was missing here until
    2026-07-23, which meant **/.claude/settings.local.json was never ignored on
    Windows machines - the deployed symlinks showed up as untracked changes in
    every repo and VS Code offered to commit them.

# --- Claude ---

# claude_settings (application_configs/claude/settings.json -> ~/.claude/
# settings.json on personal machines) deploys via personal_manifest.yaml: its
# hosts whitelist names personal machines, so it must travel with the
# inventory that validates them. Work-context variants are entries in their
# client overlay manifests, so nothing here can collide with them.

# --- T3 Code (agent control plane) ---

# Manifest-worthy: settings.json / client-settings.json / keybindings.json.
# NEVER manage: saved-environments.json (per-machine environment registry with
# an encrypted bearer token), desktop-settings.json (window-bounds churn),
# clerk-tokens.json, secrets/, state.sqlite, logs/, environment-id,
# server-runtime.json. The requires gate keeps deploy from creating ~/.t3 on
# machines that don't run T3. Electron saves settings via atomic rename, which
# replaces the deployed link with a plain file - expect NOT_A_LINK drift after
# in-app settings changes and re-deploy to re-link (merge the in-app edit into
# the repo copy first; the machine file is backed up to data/config_backups).
#
# Only keybindings.json has a mac variant: macs resolve keybindings.mac.json,
# Windows and Linux fall through to the bare file, which is the npm-server-safe
# copy - the headless `t3` server hard-rejects commands its own version
# doesn't know (RyzenWhite logged "ignoring invalid keybinding entry" for
# filePicker.toggle / projectSearch.toggle left behind by a 0.0.32 nightly).
# Servers install unpinned (t3@latest), so the bare file has to track the
# OLDEST server running anywhere: roll every server up BEFORE promoting new
# default bindings here, and remember the quiet machines are the ones that
# fall behind. See the "Server version" section of docs/setup_t3_code.md.
# settings.json and client-settings.json have no variant; if a mac drift-merge
# ever introduces a key the npm server rejects, split off a .mac.json variant
# again at that point (the 2026-08-05 split of all three left the other two
# byte-identical, so they were deleted 2026-08-14).

# t3code_settings (application_configs/t3code/settings.json ->
# ~/.t3/userdata/settings.json) deploys via personal_manifest.yaml as of
# 2026-08-06: the file stays here and is still public, but the ENTRY needs a
# hosts whitelist so client contexts can point that dest at their own copy,
# and hosts filters are overlay-manifest-only. Same split as claude_settings
# above, and for the same reason: a work machine on Bedrock needs a
# claudeAgent providerInstance whose customModels names an inference profile,
# which must not leak into the file every personal machine gets. Adding a new
# personal T3 machine means adding it to that entry's hosts list, not here.
# client-settings.json and keybindings.json are unaffected - they have no
# per-context content, so they stay below.

- name: t3code_client_settings
  repo: application_configs/t3code/client-settings.json
  dest:
    darwin: ~/.t3/userdata/client-settings.json
    linux: ~/.t3/userdata/client-settings.json
    windows: ~/.t3/userdata/client-settings.json
  requires: ~/.t3/userdata
  note: >-
    Desktop-client UI prefs; headless servers ignore it. All platforms get the
    bare file.

- name: t3code_keybindings
  repo: application_configs/t3code/keybindings.json
  dest:
    darwin: ~/.t3/userdata/keybindings.json
    linux: ~/.t3/userdata/keybindings.json
    windows: ~/.t3/userdata/keybindings.json
  requires: ~/.t3/userdata
  note: >-
    Macs get keybindings.mac.json, other platforms the bare file. Keep every
    command in the bare file within the npm server's schema - unknown commands
    make it log "ignoring invalid keybinding entry" and surface config-issue
    warnings in connected clients.

# --- Barrier (KVM sharing) ---

# Per-host barrier_config.<host>.sgc files moved to the credentials overlays
# 2026-08-14 (entry barrier_configs in personal_manifest.yaml; the client
# machine's own config was already in its context repo): a screen layout names
# every machine it spans, including work machines - cross-client inventory the
# public repo must not carry. method was none (loaded by path from the Barrier
# GUI), so there are no links to remove, but Barrier on each host must be
# re-pointed at the overlay repo's path.

# --- macOS automation ---

- name: hammerspoon_init
  repo: application_configs/hammerspoon/init.lua
  dest:
    darwin: ~/.hammerspoon/init.lua
  note: "Hammerspoon follows the link and writes window_layouts.json back into the repo."

# --- Windows automation (AutoHotkey startup scripts) ---

- name: ahk_app_jumping
  repo: scripts/app_jumping.ahk
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/app_jumping.ahk
  note: "Previously created by scripts/create_sym_links_startup.ps1."

- name: ahk_sheets
  repo: scripts/sheets.ahk
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/sheets.ahk
  note: "Previously created by scripts/create_sym_links_startup.ps1."

# --- PowerShell ---

- name: powershell_profile
  repo: application_configs/powershell/powershell_aliases.ps1
  method: none
  note: >-
    Not linked: $PROFILE dot-sources this file (". <path>"), so the profile is
    config-path indirection rather than a link. See
    docs/setup_windows_workstation_personal.md. Context-specific aliases are
    NOT in this file: it dot-sources every ~\.powershell_local.d\*.ps1 shard,
    deployed one-per-context by the *_credentials overlay manifests (same
    contract as the ~/.shell_local.d/ loader in .shared_aliases).

