  - wiztree

# winget package ids, installed by scripts/install_windows_apps_with_winget.ps1.
# What any Windows box gets, like choco above; an app sits on exactly one of
# the two.
winget:
  - Microsoft.OpenSSH.Preview

# Termux (Android) packages, installed with pkg by
# scripts/install_android_termux_apps.sh. Only that installer reads this key:
# no removal, upgrade or missing-app report covers Termux.
termux:
