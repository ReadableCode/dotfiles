  - build-essential
  - clang
  - cmake
  - fastfetch
  - git
  - golang
  - htop
  - libandroid-execinfo
  - libcrypt
  - libffi
  - libopenblas
  - libxml2
  - libxslt
  - make
  - man
  - ncdu
  - neovim
  - ninja
  - openssl
  - patchelf
  - python
  - python3
  - tmux
  - tree
  - which

# MSYS2 packages, installed with pacman by scripts/install_msys2_packages.sh
# from an MSYS2 shell. Only that installer reads this key: no removal, upgrade
# or missing-app report covers MSYS2.
msys2:
