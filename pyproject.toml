[project]
name = "dotfiles"
version = "0.1.0"
description = "dotfiles"
requires-python = ">=3.10,<3.11"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.4",
    "pandas>=2.2.3",
    "paramiko>=3.5.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "scp>=0.15.0",
    "speedtest-cli>=2.1.3",
    "tabulate>=0.9.0",
    "textual>=1.0.0",
    "types-paramiko>=4.0.0.20250822",
    "pyyaml>=6.0.2",
    "readable-utils[postgres]",
    "mcp>=2.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# One tool in place of flake8 + isort, and one config in place of .flake8,
# .isort.cfg and a [tool.flake8] block flake8 never even read (it has no
# pyproject support). The old .isort.cfg also carried ten known_third_party
# names copied from a work repo - brand_tools, concur_schemas and friends -
# none of which have ever existed here.
line-length = 120

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, C90 mccabe, I import sorting: the union of what
# flake8 and isort were checking.
select = ["E", "W", "F", "C90", "I"]
# E203 is whitespace-before-punctuation, which the formatter deliberately
# produces in slices. It was in extend-ignore for the same reason under flake8.
# (W503 had no ruff equivalent, so it simply goes.)
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "utils"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true

[tool.uv.sources]
readable-utils = { git = "https://github.com/ReadableCode/readable_utils.git", tag = "v0.3.3" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.0",
    "ruff>=0.16.8",
]
