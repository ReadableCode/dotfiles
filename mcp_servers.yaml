# MCP servers this repo owns, merged into the machine's .mcp.json by
# src/claude_mcp.py (run automatically by src/deploy_configs.py deploy).
#
# Each cloned repo DECLARES its own servers - dotfiles here, any other sibling
# repo (credentials or working) in <its own dir name>_mcp_servers.yaml, the same
# opt-in rule overlay manifests use - and one generator writes one file, holding
# every server the machine's clones add up to. That is why
# nothing races: .mcp.json has a single fixed name per directory and cannot be
# namespaced, so N declarations merging into one file is the only arrangement
# where two repos are not overwriting each other's copy.
#
# {repo_root} is this dotfiles clone, {repo_parent} its parent. Use them instead
# of absolute paths: deploy has no templating, so a literal path here would send
# every machine at the path of whichever machine wrote it. Never put a secret
# VALUE in this file - env_secrets names the env var to resolve at generate time
# (see docs/setup_google_mcp.md).
#
# dotfiles declares NO servers of its own today. The google server's CODE lives
# here (src/google_mcp.py), but which accounts it reaches is a context question,
# so each credentials repo declares its own labeled instance pinned to its own
# configs - e.g. `acme_google` with `--context acme` in acme_mcp_servers.yaml.
# An unlabeled `google` declared here would reach every context's accounts at
# once and say so nowhere, which is exactly what per-context naming prevents.
