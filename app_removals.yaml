# App removals — the committed list of packages that must NOT be installed.
# Consumed by `src/app_removals.py` (see docs/repo_app_removals.md).
#
# The app_lists/ files are the other direction: they name what should be
# installed. They are NOT an inventory of everything allowed to exist, so
# "absent from the Brewfile" can never mean "uninstall it" — most of `brew list`
# is dependencies nobody named, and each platform keeps its manual installs in
# linux_apps_non_apt.md / mac_apps_non_brew.md. Retiring an app is an explicit
# line here, the same way retiring a config path is a line in
# deploy_removals.yaml.
#
# Schema: name (unique), manager (brew/cask/apt/dnf/flatpak/choco/winget, or
# capability for a Windows optional feature), package, optional hosts:,
# replaced_by: and note:. The manager decides the platform, so no platform key
# exists. replaced_by: "manager:package" offers the removal only where that
# replacement is installed.
#
# A second copy of an app an app list already installs (the same winget id
# listed twice) needs no line here: app_removals.py finds it and offers it on
# its own. Lines are for what that cannot see.
#
# A package some app list still names is never removed — the app list wins, and
# the contradiction is printed. So re-adding a package beats a stale line here.
#
# Workflow: drop a package from an app list -> add it here -> every machine is
# offered the removal on its next gitpullall, one package at a time, after its
# manager's own dry run. Once every machine has run, the line can be dropped.

# --- RealVNC, retired 2026-09-18 ---
#
# RealVNC moved direct IP connections to its Enterprise tier, leaving the free
# and Home tiers able to reach a machine only through RealVNC's own cloud, which
# makes every one of these useless on the LAN. Replaced by TigerVNC (clients),
# wayvnc / tigervnc-scraping-server (Pi servers) and Moonlight for the GPU hosts.
# See docs/setup_vnc_server.md.

- name: realvnc_connect_viewer_cask
  manager: cask
  package: realvnc-connect-viewer
  note: >-
    The current cask name. Was `cask "vnc-viewer"` in app_lists/Brewfile until
    2026-09-18; macOS needs no replacement because Screen Sharing is built in
    and the `vnc<host>` aliases already open it.

- name: realvnc_vnc_viewer_cask
  manager: cask
  package: vnc-viewer
  note: >-
    The pre-rename cask name. A Mac that installed it before homebrew renamed
    the cask still has it recorded under this name.

- name: realvnc_connect_choco
  manager: choco
  package: vnc-connect
  note: RealVNC Connect. Dropped from app_lists/windows_apps_personal_choco.txt.

- name: realvnc_viewer_choco
  manager: choco
  package: vnc-viewer
  note: >-
    RealVNC Viewer. Dropped from app_lists/windows_apps_personal_choco.txt in
    favour of tigervnc. TightVNC stays as the Windows server.

- name: realvnc_vnc_server_apt
  manager: apt
  package: realvnc-vnc-server
  note: >-
    The Raspberry Pi servers. bookworm and later replace it with wayvnc, which
    raspi-config's VNC toggle now drives; a bullseye Pi has no wayvnc candidate,
    so upgrade the release or use tigervnc-scraping-server first. Check the Pi
    still has a working screen before agreeing to this one.

- name: realvnc_vnc_viewer_apt
  manager: apt
  package: realvnc-vnc-viewer
  note: Shipped alongside the Pi server image. Replaced by tigervnc-viewer.

# --- In-box OpenSSH server, retired 2026-09-24 ---
#
# The personal Windows machines run the Win32-OpenSSH release from winget
# (Microsoft.OpenSSH.Preview, on windows_apps_personal_winget.txt), which owns
# the sshd service from C:\Program Files\OpenSSH. The in-box optional feature
# is an older build left beside it in System32\OpenSSH. Nothing lists
# optional features, so the duplicate finder cannot see this pair; the line
# says it once.

- name: inbox_openssh_server
  manager: capability
  package: OpenSSH.Server~~~~0.0.1.0
  replaced_by: winget:Microsoft.OpenSSH.Preview
  note: >-
    Run this one from the console or VNC, never over ssh. Both copies register
    a service named sshd, and how removing the feature treats a service the
    winget copy re-registered is undocumented; afterwards check that
    `Get-Service sshd` still points at C:\Program Files\OpenSSH\sshd.exe, and
    if it is gone, `winget install --id Microsoft.OpenSSH.Preview --exact
    --force` puts it back. Windows asks for a restart to finish.
