# Goal: tmux that behaves like a normal terminal — native scrollback, native
# selection/copy/paste, no custom keybindings — but survives disconnects and
# lets multiple devices attach to the same session at once.

# Mouse is ON so that LEFT-CLICK on a pane switches to it. The bindings below
# fix the two usual mouse-on annoyances: wheel scroll cycling shell history,
# and copies landing in tmux's buffer instead of the system clipboard.
# Trade-off vs mouse off: scrollback is per-pane through tmux, not the
# terminal's native buffer. To get the old behavior back: set -g mouse off
set -g mouse on

# SCROLL WHEEL UP: always scroll the pane's output history — never translate
# to Up-arrow keypresses (which walks shell history at a prompt). If the app
# in the pane grabbed the mouse itself (vim, htop), pass the scroll through.
# copy-mode -e means SCROLLING BACK DOWN to the bottom auto-exits back to the
# live prompt — no key needed to leave.
bind -n WheelUpPane if -F '#{mouse_any_flag}' 'send -M' 'copy-mode -e; send -M'

# LEFT-CLICK + DRAG anywhere — including over full-screen apps that grab the
# mouse (claude, vim, htop) — ALWAYS starts a tmux text selection. Apps never
# receive drag events; they still get plain clicks and the scroll wheel.
bind -n MouseDrag1Pane copy-mode -M

# SCROLL WHEEL over the STATUS BAR cycles windows by default (WheelUpStatus =
# previous-window). In a short terminal the wheel lands there constantly, so a
# scroll silently switches your tab — with grouped sessions it looks like your
# view "snapped to the other device's window". Tabs are for clicking only.
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

# ...then RELEASE THE BUTTON: the selection is piped straight to the system
# clipboard and copy-mode exits immediately. No prefix, no Enter, no tmux
# paste-buffer step — just paste (Cmd+V / Ctrl+V) after.
%if "${WINDIR}"
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel clip.exe
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel clip.exe
%else
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
%endif

# Don't switch the terminal into its alternate screen. This lets tmux's output
# land in your terminal's real scrollback, so scrolling up works like normal.
set -ga terminal-overrides ',*:smcup@:rmcup@'

# Low escape-time: less ESC lag, and it shrinks the window where stray terminal
# replies (the "10;1c" Device Attributes garbage on SSH attach from Windows)
# can leak in as keystrokes.
set -sg escape-time 10

# MODIFIED KEYS (Shift+Tab etc.) pass through to apps that ask for them —
# without this, Shift+Tab inside tmux never reaches Claude Code, so cycling
# permission modes silently does nothing. `extended-keys on` makes tmux
# forward the extended sequences to inner programs that request them; the
# terminal-features line tells tmux the OUTER terminal (anything xterm-like:
# iTerm, Windows Terminal, Blink) can produce them in the first place.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# On Windows (MSYS2) every tmux window should be PowerShell. WINDIR only
# exists on Windows (COMSPEC/OS get stripped by MSYS2 bash, MSYSTEM is absent
# over ssh - WINDIR survives every launch path), and %if evaluates at parse
# time - unlike if-shell, which is async and can lose the race against the
# first window at server start.
# default-shell must ALSO be forced: SSH sessions inherit SHELL=cmd.exe
# (Win32-OpenSSH sets it to its spawn shell), tmux trusts $SHELL, and windows
# spawn `<default-shell> -c <default-command>` - cmd.exe doesn't understand
# -c and just opens interactively, which is how windows end up as bare cmd.
%if "${WINDIR}"
set -g default-shell /usr/bin/bash
set -g default-command 'powershell.exe -NoLogo'
%endif

# Multi-device attach is on by default — `tmux attach -t <name>` from a second
# device just works. Size the window to the most recently active client instead
# of shrinking to the smallest, so monitoring from a small screen doesn't
# squeeze your main one.
set -g window-size latest

# GROUPED SESSIONS (see `ta` in .shared_aliases): plain multi-attach shares
# the ACTIVE window too — clicking a tab on one device switches everyone.
# `ta` instead gives each device its own session in the same group: same
# windows, independent tab selection. With grouped sessions each viewer is a
# separate session, so without aggressive-resize a window gets sized by
# sessions that aren't even looking at it. ON = a window is sized only by the
# clients for which it is the CURRENT window (combined with window-size
# latest above: the most recent client actually viewing it wins), so an iPad
# parked on tab 3 never squeezes tabs 1-2 on the desktop.
setw -g aggressive-resize on

# --- Status line: tabs that LOOK like tabs -------------------------------------
# Default tabs run together ("0:bash* 1:vim-") — bad tap targets on a touch
# screen. Each window becomes a padded block with a gap between blocks, and
# the current window is inverted + bold so the active tab is obvious at a
# glance. #I = window index, #W = window name; the surrounding spaces are the
# padding that makes the whole block clickable, not just the text.
set -g status-style 'bg=colour234,fg=colour245'
set -g window-status-separator ' '
set -g window-status-format '#[bg=colour237,fg=colour250] #I #W '
set -g window-status-current-format '#[bg=colour39,fg=colour232,bold] #I #W '
# Window with activity/bell you're not looking at: keep the block shape,
# flip to a warning tint instead of the default reverse-video jumble.
set -g window-status-activity-style 'bg=colour130,fg=colour255'
set -g window-status-bell-style 'bg=colour160,fg=colour255'
# Left side shows WHICH VIEW this client is (grouped sessions give every
# device its own session name like main-envy-4821, so this doubles as a
# "you are device X" label). Right side: host + time, dimmed.
set -g status-left '#[bg=colour31,fg=colour255,bold] ☰ #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=colour245]#H %H:%M '

# TAP THE ☰ #S BADGE → vertical clickable window list in a POPUP. A popup is
# PER-CLIENT (drawn only on the device that tapped, sized to it) — unlike
# choose-tree, which is a pane MODE: it renders inside the shared window, so
# every attached device saw it, and mismatched client sizes left clipped
# "frozen" rows behind. Tap/Enter picks a window in THIS client's session
# only; Esc closes. The popup shell command is NOT format-expanded, so keep
# it free of # characters — list-windows' default output ("0: zsh* (2
# panes)...") already starts with the index that select-window needs; sed
# just trims the noisy layout suffix. The tree is still on prefix+w when a
# full session→window→pane view is wanted on one device.
bind -T root MouseDown1StatusLeft display-popup -E -w 46 -h 60% -T ' #S ' 'command -v fzf >/dev/null 2>&1 || { tmux display-message "fzf not installed — use prefix+w"; exit 0; }; tmux list-windows | sed "s/ \[layout.*//" | fzf --reverse --no-info --prompt=" window: " | cut -d: -f1 | xargs -r tmux select-window -t'
# Make the ACTIVE PANE obvious when a window is split: bright border on the
# focused pane, dim on the rest. Matches the active-tab blue.
set -g pane-active-border-style 'fg=colour39'
set -g pane-border-style 'fg=colour238'

