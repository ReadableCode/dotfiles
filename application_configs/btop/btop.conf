# btop settings, deployed by dotfiles (deploy_manifest.yaml entry btop_conf).
#
# Only the settings that differ from btop's defaults are listed; btop fills in every
# other key with its default when it loads this file.

# Swap goes in the memory box next to RAM. The default, swap_disk = true, lists it as a
# row in the disks panel instead and ignores show_swap.
show_swap = true
swap_disk = false

# btop rewrites its whole config file on exit when this is true, which through the deploy
# link would rewrite this tracked file (a full dump of every key, with the running btop
# version in its header). Settings changed in btop's options menu therefore last only
# until btop exits; change them here instead.
save_config_on_exit = false
