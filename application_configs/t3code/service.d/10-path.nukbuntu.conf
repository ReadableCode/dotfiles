# systemd drop-in for the T3 Code boot service (t3 service install).
#
# systemd user services source no shell rc, so the user manager's PATH is just
# /usr/local/bin:/usr/bin - it does NOT include ~/.local/bin where the agent
# CLIs live. Without this, T3 threads fail at session start with claude not
# found, even though `claude` works fine in an interactive shell.
#
# A drop-in rather than an edit to t3code.service, so `t3 service update`
# rewriting the unit leaves it intact.
[Service]
Environment=PATH=%h/.local/bin:/usr/local/bin:/usr/bin
