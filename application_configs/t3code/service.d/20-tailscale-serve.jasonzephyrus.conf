# systemd drop-in for the T3 Code boot service (t3 service install).
#
# The Linux service launcher spawns `serve` with NO arguments and no wrapper
# script (unlike the Windows t3serve.cmd), so serve flags can only be set
# through the environment it inherits. T3CODE_TAILSCALE_SERVE is the env
# equivalent of `t3 serve --tailscale-serve`; it is parsed by Effect's
# Config.boolean, so true/1/on all work.
#
# Exposes the loopback server over HTTPS on the TAILNET ONLY (serve, not
# funnel - funnel is the public one). Pairing stays token-based
# (`t3 auth pairing create`): no T3 account, no managed-tunnel slot.
#
# Requires a one-time `sudo tailscale set --operator=$USER` on the host, or
# tailscaled refuses the serve config and the server logs only a WARN.
[Service]
Environment=T3CODE_TAILSCALE_SERVE=true
