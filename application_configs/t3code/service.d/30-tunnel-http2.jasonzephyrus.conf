# systemd drop-in for the T3 Code boot service (t3 service install).
#
# T3 Connect runs a cloudflared child for its managed tunnel, and that child
# inherits this service's environment. TUNNEL_TRANSPORT_PROTOCOL is
# cloudflared's env twin of `--protocol`.
#
# QUIC to the Cloudflare edge fails from this host every time ("tls: no
# application protocol"). On a cold start cloudflared falls back to http2
# and connects, but after the connections drop (a suspend, a Wi-Fi change)
# it retries QUIC only and never connects again: on 2026-10-02 the server
# stayed up for over half an hour after a resume with 0 ready tunnel
# connections, so the machine vanished from T3 Connect. Pinning http2 means
# every reconnect uses the protocol that works.
[Service]
Environment=TUNNEL_TRANSPORT_PROTOCOL=http2
