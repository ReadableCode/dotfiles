# Removals — the committed list of files that must NOT exist any more.
# Consumed by `src/deploy_configs.py prune` (see docs/repo_deploy_configs.md).
#
# Same dest/requires/hosts schema as deploy_manifest.yaml but with NO `repo:`
# key: a removal names a destination whose source file is gone. Sibling overlay
# repos carry their own `<context>_removals.yaml` for their own dead paths;
# this file is for paths this repo's manifest used to create.
#
# Why a committed list and not per-machine state: the machine that deletes a
# manifest entry is almost never the only machine holding the link that entry
# created. This list travels with the repo, so every machine deletes the same
# known-dead paths on its next `prune --apply`. `prune` ignores any dest a live
# manifest entry still wants, so re-adding an entry beats a stale line here.
#
# Workflow: delete a manifest entry -> add its dest here -> every machine's
# next deploy applies it automatically (or `prune --apply` by hand; bare
# `prune` previews). Once every machine has deployed, the line can be dropped.

- name: removed_ahk_key_remaps_startup
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/key_remaps.ahk
  note: >-
    Dangling Startup link to the long-deleted scripts/key_remaps.ahk, left
    behind by the pre-manifest symlink script. Nothing creates it any more.

# The .lnk shortcuts the deleted interactive creator used to make. A leftover
# .lnk launches the same script a second time next to the manifest's symlink.
# Nothing creates these any more, so drop these four lines once every Windows
# machine has pruned.

- name: removed_ahk_app_jumping_lnk
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/app_jumping.lnk

- name: removed_ahk_sheets_lnk
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/sheets.lnk

- name: removed_ahk_desktop_numbers_lnk
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/desktop_numbers.lnk

- name: removed_ahk_key_remaps_lnk
  dest:
    windows: ~/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/key_remaps.lnk

- name: removed_clone_root_mcp_json
  dest:
    darwin: "{repo_parent}/.mcp.json"
    linux: "{repo_parent}/.mcp.json"
    windows: "{repo_parent}/.mcp.json"
  note: >-
    A clone-root .mcp.json src/claude_mcp.py no longer writes. It must be gone
    on every machine that ever deployed it: two .mcp.json files listing the same
    servers merge into duplicate registrations, and the stale one keeps
    resurrecting servers deleted from the declarations. Nothing creates this
    path any more - drop this line once every machine has pruned.

- name: removed_user_mcp_json
  dest:
    darwin: "~/.mcp.json"
    linux: "~/.mcp.json"
    windows: "~/.mcp.json"
  note: >-
    A machine-level .mcp.json in the user folder is inherited by every session,
    so every cloned context's servers load everywhere. src/claude_mcp.py writes
    one data/mcp/<context>.mcp.json per declaring context instead, linked into
    that context's own checkouts (per_context_repo entries), so a session
    registers only its own context's servers. Not a symlink - a regular
    generated file, which prune removes as a hard link / regular file.


- name: removed_literal_context_repo_placeholder_link
  dest:
    darwin: "{repo_parent}/{context_repo}/.claude/commands"
    linux: "{repo_parent}/{context_repo}/.claude/commands"
    windows: "{repo_parent}/{context_repo}/.claude/commands"
  note: >-
    Self-repair for a pull-order accident: a machine whose dotfiles pull is
    blocked (local edits) runs an old deploy that knows no {context_repo}
    placeholder while the credentials repos already carry per_context_repo
    entries, so it takes the token literally and links
    <clone root>/{context_repo}/.claude/commands. Removals dests expand
    {repo_parent} only, so this line names that literal path and prune deletes
    the link plus the empty chain it sits in.

